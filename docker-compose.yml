# Compatible docker-compose v1 et v2 (pas de `profiles`, pas de `name`).
# Les fichiers servis viennent du dépôt : git pull + docker-compose up -d
# suffit pour toute mise à jour du front ou de la base de connaissance,
# sans reconstruire l'image (seuls les changements Rust l'exigent).
# Ollama conteneurisé éventuel : voir docker-compose.ollama.yml.
services:
  app:
    build: .
    image: soma-souffle:latest
    container_name: soma-souffle
    volumes:
      - ./frontend:/app/static
      - ./api/knowledge:/app/knowledge
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    environment:
      PORT: 8080
      STATIC_DIR: /app/static
      KNOWLEDGE_DIR: /app/knowledge
    # Permet à l'API de joindre l'Ollama installé sur la machine hôte
    # (LLM_BASE_URL=http://host.docker.internal:11434).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 150m
